{% extends 'base.html' %}
{% block content %}
<article class="prose post">
<p class="back"><a href="/blog/">← Blog</a></p>
<h1>{{ page.title }}</h1>
<p class="post-meta"><time datetime="{{ page.date.isoformat() }}">{{ page.date.strftime('%d %B %Y') }}</time>{% if page.draft %} · <span class="draft">Draft preview</span>{% endif %}</p>
{% if page.description %}<p class="subtitle">{{ page.description }}</p>{% endif %}
{{ page.body | safe }}
</article>
{% endblock %}
